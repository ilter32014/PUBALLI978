name: ManoMINI - VDS Dual Model Ollama API

on:
  workflow_dispatch:
    inputs:
      chat_model:
        description: "Fast chat base model"
        required: true
        default: "qwen2.5:0.5b"
        type: choice
        options:
          - qwen2.5:0.5b
          - qwen2.5:1.5b
          - llama3.2:1b
          - gemma2:2b
      action_model:
        description: "Action base model"
        required: true
        default: "qwen2.5-coder:3b"
        type: choice
        options:
          - qwen2.5-coder:3b
          - qwen2.5-coder:7b
          - qwen3:4b
          - deepseek-r1:1.5b

permissions:
  contents: read
  actions: write

# This workflow is intended to run ON the VDS using a GitHub self-hosted runner.
# The runner must have sudo access. Ollama and cloudflared are installed if missing.
# No SSH connection from GitHub-hosted runners is used here.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate VDS and required files
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != "Linux" ]; then
            echo "This workflow must run on the Linux VDS self-hosted runner."
            exit 1
          fi
          if [ ! -f proxy.py ]; then
            echo "proxy.py was not found in the repository root. Add the existing ManoMINI proxy.py before running this workflow."
            exit 1
          fi
          echo "===== VDS resources ====="
          nproc
          free -h
          df -h /
          lscpu | grep -E 'Model name|CPU\(s\)|Architecture|Flags' | head -n 4 || true

      - name: Install Ollama if needed and ensure service is running
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh -o /tmp/manomini-install-ollama.sh
            sudo sh /tmp/manomini-install-ollama.sh
          fi
          if ! systemctl is-active --quiet ollama; then
            sudo systemctl enable --now ollama
          fi
          for i in {1..60}; do
            if curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null
          ollama --version

      - name: Pull selected models
        env:
          CHAT_BASE_MODEL: ${{ inputs.chat_model }}
          ACTION_BASE_MODEL: ${{ inputs.action_model }}
        shell: bash
        run: |
          set -euo pipefail
          ollama pull "$CHAT_BASE_MODEL"
          ollama pull "$ACTION_BASE_MODEL"

      - name: Create ManoMINI models
        env:
          CHAT_BASE_MODEL: ${{ inputs.chat_model }}
          ACTION_BASE_MODEL: ${{ inputs.action_model }}
        shell: bash
        run: |
          set -euo pipefail
