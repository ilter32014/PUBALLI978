name: ManoMINI - Dual Model Ollama API

on:
  workflow_dispatch:
    inputs:
      chat_model:
        description: "Fast chat base model"
        required: true
        default: "qwen2.5:0.5b"
        type: choice
        options:
          - qwen2.5:0.5b
          - qwen2.5:1.5b
          - llama3.2:1b
          - gemma2:2b
      action_model:
        description: "Powerful Action base model"
        required: true
        default: "qwen2.5-coder:3b"
        type: choice
        options:
          - qwen2.5-coder:3b
          - qwen2.5-coder:7b
          - qwen3:4b
          - deepseek-r1:1.5b
      runtime_minutes:
        description: "Maximum runner lifetime after API startup"
        required: true
        default: "180"
        type: choice
        options:
          - "60"
          - "120"
          - "180"
          - "240"

permissions:
  contents: read

jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_NUM_PARALLEL: 1
      CHAT_BASE_MODEL: ${{ inputs.chat_model }}
      ACTION_BASE_MODEL: ${{ inputs.action_model }}
      CHAT_MODEL: manomini-chat-1.0
      ACTION_MODEL: manomini-demo-1.0
      RUNTIME_MINUTES: ${{ inputs.runtime_minutes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ollama and Python
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh -o install-ollama.sh
          sh install-ollama.sh
          python3 --version
          ollama --version

      - name: Start Ollama
        shell: bash
        run: |
          set -euo pipefail
          READY=false
          if curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "Ollama is already running; reusing the existing server."
            READY=true
          else
            ollama serve > ollama.log 2>&1 &
            OLLAMA_PID=$!
            echo "$OLLAMA_PID" > ollama.pid
          fi

          for i in {1..90}; do
            if curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              READY=true
              break
            fi
            if [ -f ollama.pid ] && ! kill -0 "$(cat ollama.pid)" 2>/dev/null; then
              echo "Ollama process exited during startup."
              cat ollama.log || true
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            cat ollama.log
            exit 1
          fi

      - name: Pull selected base models
        shell: bash
        run: |
          set -euo pipefail
          ollama pull "$CHAT_BASE_MODEL"
          ollama pull "$ACTION_BASE_MODEL"

      - name: Create chat model
        shell: bash
        run: |
          set -euo pipefail
          cat > Modelfile.chat <<EOF
          FROM $CHAT_BASE_MODEL
          PARAMETER temperature 0.4
          PARAMETER num_ctx 4096
          PARAMETER num_predict 384
          SYSTEM """
          You are ManoMINI Chat, a fast conversational assistant.
          Your identity is ManoMINI-CHAT-1.0. If asked your name, say ManoMINI-CHAT-1.0.
          Handle normal conversations, general knowledge, explanations, and short coding questions.
          Never generate PUSH commands and never pretend to execute computer operations.
          Use the user's language. Be concise, accurate, and helpful.
          """
          EOF
          ollama create "$CHAT_MODEL" -f Modelfile.chat

      - name: Create action model
        shell: bash
        run: |
          set -euo pipefail
          cat > Modelfile.action <<'EOF'
          FROM PLACEHOLDER
          PARAMETER temperature 0.1
          PARAMETER top_p 0.8
          PARAMETER repeat_penalty 1.05
          PARAMETER num_ctx 4096
          PARAMETER num_predict 768
          SYSTEM """
          You are ManoMINI-DEMO-1.0 ACTION ENGINE.
          Convert computer-operation requests into exactly supported PUSH protocol commands.
          You operate through a Windows frontend and do not directly access the computer.
          Supported protocol:
          WRITE FILE: push.[write.file.{path}.content.{content}]
          DELETE FILE: push.[delete.file.{path}]
          DELETE FOLDER: push.[delete.folder.{path}]
          POWERSHELL: push.[command.powershell.command.{cmd}.type{foreground}.output.{true}]
          CMD: push.[command.cmd.command.{cmd}.type{foreground}.output.{true}]
          Use foreground when output is needed; background for long-running work.
          Never invent unsupported commands, paths, usernames, or execution results.
          For directory listings use Get-ChildItem -LiteralPath.
          For reading files use Get-Content -LiteralPath.
          For file writing use write.file.
          For deletion use delete.file or delete.folder.
          Never claim an operation succeeded without returned execution output.
          Destructive operations require explicit user authorization by the frontend.
          Output only valid PUSH commands for computer operations, without Markdown fences.
          For normal non-computer questions, do not generate PUSH commands.
          """
          EOF
          sed -i "s|^FROM PLACEHOLDER$|FROM $ACTION_BASE_MODEL|" Modelfile.action
          ollama create "$ACTION_MODEL" -f Modelfile.action

      - name: Verify models and smoke tests
        shell: bash
        run: |
          set -euo pipefail
          ollama list
          ollama list | grep -F "$CHAT_MODEL"
          ollama list | grep -F "$ACTION_MODEL"

          CHAT_RESPONSE=$(curl -fsS --max-time 120 http://127.0.0.1:11434/api/chat \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg model "$CHAT_MODEL" '{model:$model,messages:[{role:"user",content:"Reply with CHAT_OK only."}],stream:false,options:{num_predict:32}}')")
          echo "$CHAT_RESPONSE" | jq .
          echo "$CHAT_RESPONSE" | jq -e '.message.content | length > 0' >/dev/null

          ACTION_RESPONSE=$(curl -fsS --max-time 180 http://127.0.0.1:11434/api/chat \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg model "$ACTION_MODEL" '{model:$model,messages:[{role:"user",content:"List files in C:\\Users\\Example\\Desktop\\test. Return one valid PUSH command only."}],stream:false,options:{num_predict:768,temperature:0.1}}')")
          echo "$ACTION_RESPONSE" | jq .
          echo "$ACTION_RESPONSE" | jq -e '.message.content | contains("push.[")' >/dev/null

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start authenticated API proxy and tunnel
        shell: bash
        run: |
          set -euo pipefail
          API_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$API_TOKEN"
          API_ACCESS_TOKEN="$API_TOKEN" python3 -u proxy.py > proxy.log 2>&1 &
          PROXY_PID=$!
          echo "$PROXY_PID" > proxy.pid

          PROXY_READY=false
          for i in {1..45}; do
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              echo "Authenticated proxy exited during startup."
              cat proxy.log || true
              exit 1
            fi
            AUTH_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 2 --max-time 5 http://127.0.0.1:11435/api/tags 2>/dev/null || true)
            if [ "$AUTH_CODE" = "401" ]; then
              PROXY_READY=true
              break
            fi
            sleep 1
          done
          if [ "$PROXY_READY" != "true" ]; then
            echo "Authenticated proxy did not become ready on 127.0.0.1:11435."
            cat proxy.log || true
            exit 1
          fi

          cloudflared tunnel --no-autoupdate --protocol http2 \
            --url http://127.0.0.1:11435 > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          URL=""
          for i in {1..60}; do
            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo "Cloudflare tunnel process exited during startup."
              cat cloudflared.log || true
              exit 1
            fi
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Cloudflare did not provide a Quick Tunnel URL."
            cat cloudflared.log || true
            exit 1
          fi

          # Quick Tunnel DNS propagation is asynchronous. Do not test the URL
          # just because cloudflared printed it; wait until the public route
          # actually reaches the authenticated proxy.
          PUBLIC_READY=false
          for i in {1..90}; do
            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo "Cloudflare tunnel stopped before becoming reachable."
              cat cloudflared.log || true
              exit 1
            fi
            AUTH_CODE=$(curl --silent --output auth-response.json --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 15 "$URL/api/tags" 2>/dev/null || true)
            if [ "$AUTH_CODE" = "401" ]; then
              PUBLIC_READY=true
              break
            fi
            echo "Waiting for public tunnel readiness (attempt $i/90, HTTP $AUTH_CODE)..."
            sleep 3
          done
          if [ "$PUBLIC_READY" != "true" ]; then
            echo "Public tunnel did not reach the authenticated proxy in time."
            echo "Last HTTP status: $AUTH_CODE"
            cat auth-response.json 2>/dev/null || true
            cat proxy.log || true
            cat cloudflared.log || true
            exit 1
          fi

          AUTH_READY=false
          for i in {1..15}; do
            AUTH_CODE=$(curl -sS --connect-timeout 5 --max-time 20 -o auth-response.json -w '%{http_code}' \
              -H "Authorization: Bearer $API_TOKEN" "$URL/api/tags" || true)
            if [ "$AUTH_CODE" = "200" ]; then
              AUTH_READY=true
              break
            fi
            echo "Waiting for authenticated API response (attempt $i/15, HTTP $AUTH_CODE)..."
            sleep 3
          done
          if [ "$AUTH_READY" != "true" ]; then
            echo "Authenticated public API verification failed after retries (HTTP $AUTH_CODE)."
            cat proxy.log
            cat cloudflared.log
            [ ! -f auth-response.json ] || cat auth-response.json
            exit 1
          fi

          mkdir -p connection
          printf 'OLLAMA_URL=%s\nAPI_TOKEN=%s\nCHAT_MODEL=%s\nACTION_MODEL=%s\n' \
            "$URL" "$API_TOKEN" "$CHAT_MODEL" "$ACTION_MODEL" > connection/connection.txt
          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          {
            echo "## ManoMINI Dual Model API"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Chat base | $CHAT_BASE_MODEL |"
            echo "| Chat API model | $CHAT_MODEL |"
            echo "| Action base | $ACTION_BASE_MODEL |"
            echo "| Action API model | $ACTION_MODEL |"
            echo "| Runtime | $RUNTIME_MINUTES minutes |"
            echo "| Public API | $URL |"
            echo ""
            echo "The API requires the private connection artifact's Bearer token."
            echo "Download the \`manomini-connection\` artifact from this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private connection details
        uses: actions/upload-artifact@v4
        with:
          name: manomini-connection
          path: connection/connection.txt
          retention-days: 1

      - name: Keep API alive and monitor health
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SECONDS=$((RUNTIME_MINUTES * 60))
          DEADLINE=$((SECONDS + RUNTIME_SECONDS))
          echo "ManoMINI is ready: $PUBLIC_URL"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            if ! curl -fsS --max-time 10 http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama stopped."
              cat ollama.log
              exit 1
            fi
            if ! kill -0 "$(cat proxy.pid)" 2>/dev/null; then
              echo "Authenticated proxy stopped."
              cat proxy.log
              exit 1
            fi
            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo "Cloudflare tunnel stopped."
              cat cloudflared.log
              exit 1
            fi
            sleep 30
          done
          echo "Requested runtime completed."

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manomini-diagnostics
          path: |
            ollama.log
            proxy.log
            cloudflared.log
          if-no-files-found: ignore
          retention-days: 3
